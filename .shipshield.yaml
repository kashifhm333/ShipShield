schema_version: 1
project:
  name: "shipshield"
  root: "."
reports:
  directory: ".shipshield/reports"
  formats:
    - "json"
    - "markdown"
  retain: 20
scan:
  secrets:
    enabled: true
  dependencies:
    enabled: true
  containers:
    enabled: true
  iac:
    enabled: true
policy:
  fail_on:
    - "critical"
    - "high"
  fail_on_incomplete: true
execution:
  timeout_seconds: 600
  max_parallel_scanners: 4
  network: "allow"
  exclude:
    - ".git/**"
    - "node_modules/**"
    - "vendor/**"
    - "dist/**"
    - ".shipshield/**"
