name: ShipShield Production CI/CD Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Typecheck, Lint, Test & Coverage Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'

      - name: Install Dependencies (Deterministic)
        run: npm ci

      - name: Build Monorepo (Generate Declaration Files)
        run: npm run build

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Code Quality & Lint Gate
        run: npm run lint

      - name: Unit & Integration Test Suite (Coverage Gate)
        run: npm run test:coverage

      - name: Dogfood CLI Smoke & Offline Tests
        run: |
          node apps/cli/dist/index.js --version
          node apps/cli/dist/index.js --help
          node apps/cli/dist/index.js doctor
          node apps/cli/dist/index.js doctor --json
          node apps/cli/dist/index.js plan --list-scanners
          node apps/cli/dist/index.js scan --offline --format json

  packaging-gate:
    name: Ubuntu Debian & Launchpad Source Package Gate
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'

      - name: Install Packaging Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            fakeroot \
            debhelper \
            lintian

      - name: Install Dependencies
        run: npm ci

      - name: Build Debian Binary & Launchpad Source Packages
        run: ./packaging/build-deb.sh

      - name: Validate Release Artifacts Integrity
        run: |
          cd dist-deb
          sha256sum -c SHA256SUMS
          ls -lh

      - name: Verify Debian Source Package Extraction (Chroot Simulation)
        run: |
          dpkg-source -x dist-deb/shipshield_*.dsc /tmp/chroot-source-verify
          test -d /tmp/chroot-source-verify/packages
          test -d /tmp/chroot-source-verify/apps
          test -f /tmp/chroot-source-verify/debian/rules
          echo "✔ Source package extracted and verified cleanly."

      - name: Run Lintian on Debian Binary Package
        run: |
          lintian --tag-display-limit 0 dist-deb/shipshield_*_all.deb

      - name: Test Local .deb Package Installation (with Dependency Resolution)
        run: |
          sudo apt-get install -y ./dist-deb/shipshield_*_all.deb
          which shipshield
          shipshield --version
          shipshield doctor
          shipshield doctor --json
          shipshield scan --offline
          shipshield plan --list-scanners

      - name: Test Local .deb Package Removal
        run: |
          sudo apt-get remove -y shipshield
          if [ -f /usr/bin/shipshield ]; then
            echo "Error: shipshield binary still present after removal!" >&2
            exit 1
          fi
          echo "✔ Package removal verified cleanly."

      - name: Archive Packaging Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shipshield-ubuntu-packages
          path: dist-deb/*
          retention-days: 7
