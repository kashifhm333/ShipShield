version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: shipshield-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: shipshield-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api
    container_name: shipshield-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/shipshield
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=production-secret-change-me
      - GITHUB_WEBHOOK_SECRET=production-webhook-secret-change-me
      - WORKER_INTERNAL_HMAC_SECRET=production-worker-hmac-secret-change-me
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    container_name: shipshield-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - WORKER_INTERNAL_HMAC_SECRET=production-worker-hmac-secret-change-me
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mongo-data:
  redis-data:
